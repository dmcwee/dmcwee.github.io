<!--<h1 class="blog-heading" style="padding: 0.5rem; margin-bottom: 1rem;">Tenant Tracker</h1>-->

<div class="tenant-search">
    <form id="tenantForm" onsubmit="checkTenant(); return false;">
        <div class="tenant-search-bar">
            <input type="text" placeholder="Tenant Name: tenant.onmicrosoft.com" name="tenantName" id="tenantName" class="tenant-input" />
            <button type="submit" class="tenant-btn">Check Tenant</button>
        </div>
    </form>
</div>

<div class="tenant-results-wrapper" id="result_container">
    <div class="tenant-results-layout">
        <div id="results" style="display:none;"></div>
        <div id="domains" style="display:none;"></div>
        <div id="raw" style="display: none;"></div>
    </div>
</div>

{% raw %}
<script type="text/x-handlebars-template" id="results-display">
    <div class="tenant-info-card">
        <div class="tenant-info-row">
            <span class="tenant-info-label">Tenant ID:</span>
            <span class="tenant-info-value">{{tenantId token_endpoint }}</span>
        </div>
        <div class="tenant-info-row">
            <span class="tenant-info-label">Tenant Location:</span>
            <span class="tenant-info-value">{{tenantLocation tenant_region_scope }}</span>
        </div>
        <div class="tenant-info-row">
            <span class="tenant-info-label">B2B Availability:</span>
            <span class="tenant-info-value">{{tenantB2BAvailable tenant_region_scope }}</span>
        </div>
        <div class="tenant-info-row">
            <span class="tenant-info-label">Tenant Region:</span>
            <span class="tenant-info-value">{{tenantRegion tenant_region_scope tenant_region_sub_scope }}</span>
        </div>
        <div class="tenant-info-row">
            <span class="tenant-info-label">Tenant Whitelisted:</span>
            <span class="tenant-info-value">{{tenantWhiteListed cloud_instance_name tenant_region_scope}}</span>
        </div>
    </div>
</script>

<script type="text/x-handlebars-template" id="results-error">
    {{#if invalidTenant}}
    <div class="tenant-error-msg">
        <b>The tenant or domain name does not appear to be in use or registered in Azure AD.</b><br/>You can expand the results to see more details.
    </div>
    {{/if}}
    {{#if error}}
    <div class="tenant-error-msg">
        <b>An Error <i>{{ error }}</i> occurred, expand the results to see details.</b>
    </div>
    <div class="tenant-error-msg">{{ errorDescription }}</div>
    {{/if}}
</script>

<script type="text/x-handlebars-template" id="results-raw">
    <div class="tenant-raw-card">
        <div class="tenant-raw-header">
            <span><b>Raw Results</b></span>
            <button type="button" class="tenant-btn tenant-btn-sm" onclick="toggleResult(); return false;">Toggle</button>
        </div>
        <div class="tenant-raw-body" style="display:none;" id="result">
            <div>{{stringify this }}</div>
        </div>
    </div>
</script>

<script type="text/x-handlebars-template" id="domains-display">
    <div class="tenant-domains-card">
        <h5>Registered Domains</h5>
        <ul>
            {{#each domains}}
            <li class="tenant-info-row"><span class="tenant-info-value">{{ this }}</span></li>
            {{/each}}
        </ul>
    </div>
</script>
{% endraw %}
